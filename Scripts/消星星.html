                showScene('startScene');
            });
            
            $('hintBtn').addEventListener('click', showHint);
            
            $('bombBtn').addEventListener('click', () => {
                if (isGameOver || isPaused || isRefreshing || bombCount <= 0) return;
                initAudio();
                cancelItemMode();
                itemMode = 'bomb';
                $('bombBtn').classList.add('active');
                playSound('item');
            });
            
            $('dyeBtn').addEventListener('click', () => {
                if (isGameOver || isPaused || isRefreshing || dyeCount <= 0) return;
                initAudio();
                cancelItemMode();
                showDyeModal();
            });
            
            $('refreshBtn').addEventListener('click', handleRefresh);
            
            $('dyeCancelBtn').addEventListener('click', () => {
                closeAllModals();
                cancelItemMode();
            });
            
            $('pauseBtn').addEventListener('click', pauseGame);
            
            $('pauseResumeBtn').addEventListener('click', resumeGame);
            
            $('pauseRestartBtn').addEventListener('click', () => {
                closeModal('pauseModal');
                isGameOver = true;
                isPaused = false;
                isRefreshing = false;
                clearInterval(timerInterval);
                if (gameMode === 'classic') {
                    startClassicGame();
                } else {
                    startLevelGame(false, false);
                }
            });
            
            $('pauseHomeBtn').addEventListener('click', () => {
                closeModal('pauseModal');
                stopBGM();
                isGameOver = true;
                isPaused = false;
                isRefreshing = false;
                clearInterval(timerInterval);
                if (gameMode !== 'classic') {
                    saveProgress();
                }
                showScene('startScene');
            });
            
            $('bgmSlider').addEventListener('input', (e) => {
                bgmVolume = e.target.value / 100;
                $('bgmValue').textContent = e.target.value + '%';
                if (bgmGain) {
                    bgmGain.gain.value = bgmVolume * 0.1;
                }
            });
            
            $('sfxSlider').addEventListener('input', (e) => {
                sfxVolume = e.target.value / 100;
                $('sfxValue').textContent = e.target.value + '%';
            });
            
            $('classicHomeBtn').addEventListener('click', () => {
                closeModal('classicVictoryModal');
                stopBGM();
                isGameOver = true;
                showScene('startScene');
            });
            
            $('classicRestartBtn').addEventListener('click', () => {
                closeModal('classicVictoryModal');
                stopBGM();
                isGameOver = true;
                startClassicGame();
            });
            
            $('levelFailedHomeBtn').addEventListener('click', () => {
                closeModal('levelFailedModal');
                stopBGM();
                isGameOver = true;
                clearProgress();
                showScene('startScene');
            });
            
            $('levelFailedRestartBtn').addEventListener('click', () => {
                closeModal('levelFailedModal');
                startLevelGame(false, true);
            });
            
            $$('.modal-overlay').forEach(modal => {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal && modal.id !== 'pauseModal') {
                        modal.classList.remove('active');
                    }
                });
            });
            
            const noMore = localStorage.getItem('xiaoxingxing_no_tutorial');
            if (!noMore) {
                setTimeout(() => showTutorial(), 500);
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>

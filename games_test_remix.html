<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Rift Duel Remix</title>
<style>
:root{
  --bg1:#0d1430;--bg2:#1d2a57;--panel:rgba(10,14,34,.78);--border:rgba(157,188,255,.4);
  --a:#ff8066;--b:#56c5ff;--txt:#eef2ff;--muted:#9eb1dc;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;color:var(--txt);font-family:"Segoe UI","Microsoft YaHei",sans-serif;
background:radial-gradient(1100px 700px at 20% -10%,#2f4a8c 0,transparent 60%),radial-gradient(900px 500px at 90% 110%,#5a2048 0,transparent 70%),linear-gradient(180deg,var(--bg2),var(--bg1));}
#app{position:relative;width:100%;height:100%}
#c{width:100%;height:100%;display:block}
.hud{position:absolute;inset:0;pointer-events:none;padding:10px}
.top{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.pill{background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;backdrop-filter:blur(6px)}
#state{color:#ffe39c}
#timer{text-align:center;min-width:90px;justify-self:end}
.card{display:flex;gap:8px;align-items:center;max-width:260px}
.card.r{justify-self:end;flex-direction:row-reverse}
.badge{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:800;border:1px solid rgba(255,255,255,.35)}
.badge.a{background:linear-gradient(145deg,#ff9c73,#ff5a66)}
.badge.b{background:linear-gradient(145deg,#74ddff,#3478ff)}
.name{font-size:12px;color:var(--muted);margin-bottom:4px}
.bar{height:9px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.15);overflow:hidden}
.bar+.bar{margin-top:4px;height:6px;background:rgba(100,200,255,.15)}
.fill{height:100%;width:100%;transition:width .2s}
#aHp{background:linear-gradient(90deg,#ff6b6b,#ffcb76)}
#bHp{background:linear-gradient(90deg,#4ec8ff,#88f3ff)}
#aSd,#bSd{background:linear-gradient(90deg,#96faff,#72a4ff)}
#toast{position:absolute;left:50%;top:18%;transform:translate(-50%,-50%);background:rgba(8,12,30,.85);border:1px solid rgba(198,216,255,.4);border-radius:10px;padding:9px 14px;font-size:14px;opacity:0;transition:.2s;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,-60%)}
.controls{pointer-events:auto;position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:min(920px,calc(100vw - 10px));
background:linear-gradient(180deg,rgba(10,14,34,.65),rgba(6,9,24,.9));border:1px solid var(--border);border-radius:14px;padding:9px;
display:grid;grid-template-columns:1.1fr 1.4fr 1fr;gap:8px}
.box{background:rgba(10,18,42,.45);border:1px solid rgba(157,188,255,.24);border-radius:10px;padding:8px}
.h{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.row label{width:42px;font-size:12px}
.row input{flex:1;accent-color:#84d2ff}
.val{width:42px;text-align:right;font-size:12px;color:#fff0bf}
.btns{display:flex;gap:6px;flex-wrap:wrap}
button{border:1px solid rgba(173,199,255,.45);background:linear-gradient(180deg,#1c2c58,#101a3a);color:#f2f7ff;border-radius:9px;padding:7px 9px;font-size:12px;cursor:pointer;transition:.12s}
button:hover{filter:brightness(1.12)}button:active{transform:translateY(1px)}button:disabled{opacity:.5;cursor:not-allowed}
.w.active{border-color:rgba(255,219,134,.95);box-shadow:0 0 0 1px rgba(255,219,134,.3) inset}
.s.ready{border-color:rgba(99,240,171,.75)}
#fire{height:82px;font-size:16px;font-weight:800;background:radial-gradient(circle at 30% 30%,#ffd184,#ff8756 45%,#d63d61);border-color:rgba(255,232,185,.76)}
#fire.ch{animation:p .24s linear infinite}
#help{font-size:11px;line-height:1.35;color:#b7c8f5;margin-top:5px}
@keyframes p{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
@media (max-width:860px){.controls{grid-template-columns:1fr}.top{grid-template-columns:1fr}.card,.card.r{justify-self:start;flex-direction:row}#timer{justify-self:start}}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="top">
      <div class="card" id="cardA"><div class="badge a">A</div><div style="flex:1"><div class="name">Player A</div><div class="bar"><div class="fill" id="aHp"></div></div><div class="bar"><div class="fill" id="aSd"></div></div></div></div>
      <div class="pill" id="state">Round 1 · Player A</div>
      <div class="card r" id="cardB"><div class="badge b">B</div><div style="flex:1"><div class="name">Player B</div><div class="bar"><div class="fill" id="bHp"></div></div><div class="bar"><div class="fill" id="bSd"></div></div></div></div>
      <div class="pill" id="timer">20.0s</div>
    </div>
    <div id="toast"></div>
    <div class="controls">
      <div class="box">
        <div class="h">瞄准</div>
        <div class="row"><label>角度</label><input id="angle" type="range" min="10" max="170" value="45"><span class="val" id="angleV">45°</span></div>
        <div class="row"><label>力度</label><input id="power" type="range" min="35" max="100" value="62"><span class="val" id="powerV">62</span></div>
        <div id="help">移动 A/D 或 ←/→<br>微调 Q/E/J/L</div>
      </div>
      <div class="box">
        <div class="h">武器与技能</div>
        <div class="btns">
          <button class="w" data-w="pulse">脉冲弹</button><button class="w" data-w="split">分裂弹</button><button class="w" data-w="quake">震荡钻</button>
        </div>
        <div style="height:6px"></div>
        <div class="btns">
          <button class="s" data-s="shield">护盾 +35</button><button class="s" data-s="gust">飓风重掷</button><button class="s" data-s="warp">相位前冲</button>
        </div>
        <div id="help">1/2/3 选武器 · Z/X/C 技能 · Space 发射</div>
      </div>
      <div class="box" style="display:grid;gap:7px;align-content:start">
        <button id="fire">按住蓄力发射</button>
        <button id="restart">重新开始 (R)</button>
        <div id="wind" style="font-size:12px;color:#b7c8f5">风力: 0.00</div>
      </div>
    </div>
  </div>
</div>
<script>
(()=>{
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const cvs=$("#c"),ctx=cvs.getContext("2d");
const ui={state:$("#state"),timer:$("#timer"),wind:$("#wind"),toast:$("#toast"),angle:$("#angle"),power:$("#power"),angleV:$("#angleV"),powerV:$("#powerV"),
fire:$("#fire"),restart:$("#restart"),aHp:$("#aHp"),bHp:$("#bHp"),aSd:$("#aSd"),bSd:$("#bSd"),cardA:$("#cardA"),cardB:$("#cardB"),ws:$$(".w"),ss:$$(".s")};
const world={w:2200,h:1280,sea:1115,g:.28},HP=130;
const terrain=new Float32Array(world.w+1);
const stars=Array.from({length:110},()=>({x:Math.random(),y:Math.random()*.62,s:Math.random()*1.7+.5}));
const weapons={pulse:{n:"脉冲弹",d:44,r:78,c:48,i:8,col:"#ffc766"},split:{n:"分裂弹",d:30,r:58,c:34,i:6,col:"#78f0a9"},quake:{n:"震荡钻",d:36,r:68,c:74,i:10,col:"#ff8b92"}};
const P=[mkP(0,"Player A","#ff6f6f",320,45),mkP(1,"Player B","#66c7ff",world.w-320,135)];
const G={phase:"aim",turn:0,round:1,timer:20,wind:rWind(),winner:null,res:0};
const cam={x:world.w/2,y:700,z:.92};
let prj=[],part=[],txt=[],dpr=1,vw=0,vh=0,last=performance.now(),toastTimer=null,charge=null;
const key={l:false,r:false};

function mkP(i,n,c,x,a){return{i,n,c,x,y:0,vx:0,vy:0,r:20,hp:HP,sd:0,a,p:62,w:"pulse",alive:true,on:true,cd:{shield:0,gust:0,warp:0}}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function rad(d){return d*Math.PI/180}
function lighten(hex,k){hex=hex.replace("#","");const r=clamp(parseInt(hex.slice(0,2),16)+Math.round(255*k),0,255),g=clamp(parseInt(hex.slice(2,4),16)+Math.round(255*k),0,255),b=clamp(parseInt(hex.slice(4,6),16)+Math.round(255*k),0,255);return `rgb(${r},${g},${b})`}
function rWind(){return Math.round((Math.random()*.52-.26)*100)/100}
function ap(){return P[G.turn]}
function can(){return G.phase==="aim"&&!G.winner&&ap().alive}
function tY(x){x=clamp(x,0,world.w);const i=Math.floor(x),k=x-i;return terrain[i]+(terrain[Math.min(i+1,world.w)]-terrain[i])*k}
function sx(x){return(x-cam.x)*cam.z+vw*.5}
function sy(y){return(y-cam.y)*cam.z+vh*.5}
function toast(s){ui.toast.textContent=s;ui.toast.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>ui.toast.classList.remove("show"),1100)}

function genTerrain(){
  const base=world.sea-320;
  for(let x=0;x<=world.w;x++){
    let y=base+Math.sin(x*.0046)*58+Math.sin(x*.0117+1.1)*24+Math.sin(x*.072+.8)*5;
    if(x<180||x>world.w-180)y+=20;
    terrain[x]=clamp(y,640,world.sea-65);
  }
}
function place(){for(const p of P){p.y=tY(p.x)-p.r;p.vx=0;p.vy=0;p.on=true}}
function resize(){dpr=Math.min(devicePixelRatio||1,2);vw=Math.max(320,innerWidth);vh=Math.max(360,innerHeight);cvs.width=Math.floor(vw*dpr);cvs.height=Math.floor(vh*dpr);cvs.style.width=vw+"px";cvs.style.height=vh+"px";ctx.setTransform(dpr,0,0,dpr,0,0)}

function syncAim(){const p=ap();ui.angle.value=Math.round(p.a);ui.power.value=Math.round(p.p);ui.angleV.textContent=Math.round(p.a)+"°";ui.powerV.textContent=Math.round(p.p)}
function skillText(k,cd){const m={shield:"护盾 +35",gust:"飓风重掷",warp:"相位前冲"};return cd>0?`${m[k]} (${cd})`:m[k]}
function refreshBtns(){const p=ap();for(const b of ui.ws)b.classList.toggle("active",b.dataset.w===p.w);for(const b of ui.ss){const cd=p.cd[b.dataset.s];b.disabled=!can()||cd>0;b.classList.toggle("ready",cd===0);b.textContent=skillText(b.dataset.s,cd)}ui.fire.disabled=!can()}
function hud(){
  const p=ap(),rt=`Round ${G.round}`,tt=G.winner?G.winner.n:`${p.n} 回合`;
  ui.state.textContent=`${rt} · ${tt}`;ui.timer.textContent=G.winner?"结束":G.timer.toFixed(1)+"s";ui.wind.textContent=`风力: ${G.wind>0?"+":""}${G.wind.toFixed(2)}`;
  ui.aHp.style.width=(clamp(P[0].hp/HP,0,1)*100).toFixed(2)+"%";ui.bHp.style.width=(clamp(P[1].hp/HP,0,1)*100).toFixed(2)+"%";
  ui.aSd.style.width=(clamp(P[0].sd/60,0,1)*100).toFixed(2)+"%";ui.bSd.style.width=(clamp(P[1].sd/60,0,1)*100).toFixed(2)+"%";
  ui.cardA.style.opacity=P[0].alive?1:.55;ui.cardB.style.opacity=P[1].alive?1:.55;
  ui.cardA.style.filter=G.turn===0&&G.phase!=="gameover"?"drop-shadow(0 0 10px rgba(255,223,125,.5))":"none";
  ui.cardB.style.filter=G.turn===1&&G.phase!=="gameover"?"drop-shadow(0 0 10px rgba(255,223,125,.5))":"none";
}
function startTurn(i,reroll){G.turn=i;G.phase="aim";G.timer=20;if(reroll)G.wind=rWind();const p=ap();for(const k of Object.keys(p.cd))if(p.cd[k]>0)p.cd[k]--;p.a=clamp(p.a,10,170);p.p=clamp(p.p,35,100);syncAim();refreshBtns()}
function endTurn(){if(G.winner)return;const alive=P.filter(p=>p.alive);if(alive.length<=1){winCheck();return}let n=(G.turn+1)%2;while(!P[n].alive)n=(n+1)%2;G.round++;startTurn(n,true)}
function stable(){for(const p of P){if(!p.alive)continue;if(!p.on||Math.abs(p.vx)>.2||Math.abs(p.vy)>.2)return false}return true}
function dmg(p,val,src){if(!p.alive)return;let v=Math.round(val);if(p.sd>0&&v>0){const ab=Math.min(p.sd,v);p.sd-=ab;v-=ab;if(ab>0)txt.push({x:p.x,y:p.y-28,t:`盾-${ab}`,c:"#86f8ff",l:.75})}if(v>0){p.hp=clamp(p.hp-v,0,HP);txt.push({x:p.x,y:p.y-20,t:`-${v}`,c:"#ffd5a0",l:.8})}if(p.hp<=0&&p.alive){p.alive=false;p.sd=0;toast(`${p.n} 被 ${src} 击破`)}}
function carve(cx,r,d){const s=Math.max(2,Math.floor(cx-r)),e=Math.min(world.w-2,Math.ceil(cx+r));for(let x=s;x<=e;x++){const dx=Math.abs(x-cx);if(dx>r)continue;const f=1-(dx/r)**2;terrain[x]=Math.min(world.h-10,terrain[x]+f*d)}for(let t=0;t<2;t++)for(let x=s;x<=e;x++)terrain[x]=(terrain[x-1]+terrain[x]*2+terrain[x+1])/4}
function explode(x,y,pro,owner){
  carve(x,pro.c,pro.c*.88);
  for(let i=0;i<42;i++){const a=Math.random()*Math.PI*2,sp=Math.random()*4.4+.8;part.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.2,l:.38+Math.random()*.5,a:0,r:Math.random()*3.2+1.3,c:pro.col})}
  for(const p of P){if(!p.alive)continue;const dx=p.x-x,dy=p.y-y,dist=Math.hypot(dx,dy),m=pro.r+p.r;if(dist>=m)continue;const f=1-dist/m;dmg(p,Math.max(1,Math.round(pro.d*f)),owner!==null?`P${owner+1}`:"爆炸");const nx=dx/(dist||1);p.vx+=nx*pro.i*f;p.vy-=(pro.i*.85+.8)*f;p.on=false}
}
function split(i){const s=prj[i],ang=Math.atan2(s.vy,s.vx),sp=Math.max(11,Math.hypot(s.vx,s.vy)*.92);for(const d of[-.3,0,.3]){const a=ang+d;prj.push({x:s.x,y:s.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:0,owner:s.owner,k:"mini",sd:true,col:"#7cf9b6",pro:{d:19,r:44,c:22,i:4.2,col:"#9bf5be"}})}part.push({x:s.x,y:s.y,vx:0,vy:0,l:.3,a:0,r:20,c:"rgba(143,255,199,.45)"});prj.splice(i,1);toast("分裂弹裂变")}
function fire(ch){if(!can())return;const p=ap(),pro=weapons[p.w],pow=clamp(p.p+ch*20,35,118),sp=8.6+pow*.2,a=rad(p.a);prj.push({x:p.x+Math.cos(a)*27,y:p.y-Math.sin(a)*22,vx:Math.cos(a)*sp,vy:-Math.sin(a)*sp,l:0,owner:p.i,k:p.w,sd:false,col:pro.col,pro});G.phase="projectile";G.res=0;toast(`${p.n} 发射 ${pro.n}`)}
function use(skill){if(!can())return;const p=ap();if(p.cd[skill]>0)return;if(skill==="shield"){p.sd=clamp(p.sd+35,0,60);p.cd.shield=3;toast(`${p.n} 展开护盾`)}else if(skill==="gust"){G.wind=Number((Math.random()*1.1-.55).toFixed(2));p.cd.gust=2;toast(`风场重置: ${G.wind>0?"+":""}${G.wind.toFixed(2)}`)}else if(skill==="warp"){const dir=p.i===0?1:-1,shift=dir*(60+Math.random()*65);p.x=clamp(p.x+shift,p.r+4,world.w-p.r-4);p.y=tY(p.x)-p.r;p.vx=0;p.vy=0;p.cd.warp=2;toast(`${p.n} 相位前冲`)}}
function winCheck(){if(G.winner)return;const alive=P.filter(p=>p.alive);if(alive.length===1){G.winner=alive[0];G.phase="gameover";toast(`${alive[0].n} 获胜`)}else if(alive.length===0){G.winner={n:"平局"};G.phase="gameover";toast("双方同时坠毁，平局")}}
function reset(){genTerrain();P[0]=mkP(0,"Player A","#ff6f6f",320,45);P[1]=mkP(1,"Player B","#66c7ff",world.w-320,135);place();prj=[];part=[];txt=[];G.round=1;G.winner=null;G.wind=rWind();startTurn(0,false);toast("新对局开始")}

function uPlayers(step){
  if(G.phase==="aim"&&!G.winner){const p=ap(),m=(key.r?1:0)-(key.l?1:0);if(m&&p.on)p.vx+=m*.42}
  for(const p of P){if(!p.alive)continue;p.vy+=world.g*step;p.x+=p.vx*step;p.y+=p.vy*step;p.x=clamp(p.x,p.r+4,world.w-p.r-4);p.vx*=p.on?.82:.992;
    const g=tY(p.x)-p.r;if(p.y>=g){if(!p.on&&p.vy>9.5){const hit=p.vy-9.5,fd=Math.min(24,Math.round(hit*2.5));if(fd>0)dmg(p,fd,"坠落")}p.y=g;p.vy=0;p.on=true}else p.on=false;
    if(p.y>world.sea+170){p.hp=0;p.alive=false;p.sd=0;toast(`${p.n} 掉入裂隙`)}}
}
function uPrj(step){
  if(G.phase!=="projectile"){
    if(G.phase==="resolve"){G.res-=step/60;if(G.res<=0&&prj.length===0&&stable())endTurn()}
    return;
  }
  for(let i=prj.length-1;i>=0;i--){const s=prj[i];s.l+=step/60;s.vx+=G.wind*.036*step;s.vy+=world.g*.92*step;s.x+=s.vx*step;s.y+=s.vy*step;
    part.push({x:s.x,y:s.y,vx:(Math.random()-.5)*.4,vy:-Math.random()*.3,l:.22+Math.random()*.24,a:0,r:1.2+Math.random()*1.8,c:s.col});
    if(s.k==="split"&&!s.sd&&s.vy>.1&&s.l>.18){split(i);continue}
    const out=s.x<-40||s.x>world.w+40||s.y>world.h+120,hit=s.x>=0&&s.x<=world.w&&s.y>=tY(s.x);
    if(hit){explode(s.x,s.y,s.pro,s.owner);prj.splice(i,1);continue}
    if(s.y>=world.sea){explode(s.x,world.sea,s.pro,s.owner);prj.splice(i,1);continue}
    if(out)prj.splice(i,1);
  }
  if(prj.length===0){G.phase="resolve";G.res=.55}
}
function uPart(dt){for(let i=part.length-1;i>=0;i--){const p=part[i];p.a+=dt;p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.vy+=.06*dt*60;p.vx*=.99;if(p.a>=p.l)part.splice(i,1)}}
function uTxt(dt){for(let i=txt.length-1;i>=0;i--){const t=txt[i];t.l-=dt;t.y-=28*dt;if(t.l<=0)txt.splice(i,1)}}
function uCam(dt){let tx,ty,tz;if(G.phase==="projectile"&&prj.length){tx=prj[0].x;ty=prj[0].y;tz=.83}else{const a=P[0].alive?P[0].x:world.w*.25,b=P[1].alive?P[1].x:world.w*.75;tx=(a+b)/2;ty=710;tz=.9}const s=1-Math.exp(-dt*6);cam.x=lerp(cam.x,tx,s);cam.y=lerp(cam.y,ty,s);cam.z=lerp(cam.z,tz,1-Math.exp(-dt*4))}

function drawSky(t){const g=ctx.createLinearGradient(0,0,0,vh);g.addColorStop(0,"#1a2d56");g.addColorStop(.45,"#1a1b43");g.addColorStop(1,"#0c142e");ctx.fillStyle=g;ctx.fillRect(0,0,vw,vh);
  for(const s of stars){const tw=.55+Math.sin(t*2.3+s.x*14)*.45;ctx.globalAlpha=tw;ctx.fillStyle="#d2e8ff";ctx.beginPath();ctx.arc(s.x*vw,s.y*vh,s.s,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
  const mx=vw*.84,my=vh*.2,m=ctx.createRadialGradient(mx-12,my-10,8,mx,my,44);m.addColorStop(0,"rgba(255,247,212,.96)");m.addColorStop(1,"rgba(255,247,212,0)");ctx.fillStyle=m;ctx.beginPath();ctx.arc(mx,my,46,0,Math.PI*2);ctx.fill()}
function drawWorld(t){const lx=cam.x-vw/(2*cam.z)-4,rx=cam.x+vw/(2*cam.z)+4,s=Math.max(0,Math.floor(lx)),e=Math.min(world.w,Math.ceil(rx));
  const sea=sy(world.sea),water=ctx.createLinearGradient(0,sea,0,vh);water.addColorStop(0,"rgba(70,130,255,.35)");water.addColorStop(1,"rgba(28,50,118,.78)");ctx.fillStyle=water;ctx.fillRect(0,sea,vw,vh-sea);
  ctx.beginPath();let f=1;for(let x=s;x<=e;x+=2){const px=sx(x),py=sy(terrain[x]);if(f){ctx.moveTo(px,py);f=0}else ctx.lineTo(px,py)}ctx.lineTo(sx(e),vh+40);ctx.lineTo(sx(s),vh+40);ctx.closePath();
  const grd=ctx.createLinearGradient(0,sy(world.sea-360),0,vh);grd.addColorStop(0,"#4a5f5b");grd.addColorStop(.6,"#3d4f49");grd.addColorStop(1,"#1f2b2e");ctx.fillStyle=grd;ctx.fill();
  ctx.strokeStyle="rgba(220,243,236,.35)";ctx.lineWidth=2;ctx.beginPath();f=1;for(let x=s;x<=e;x+=3){const px=sx(x),py=sy(terrain[x]-2);if(f){ctx.moveTo(px,py);f=0}else ctx.lineTo(px,py)}ctx.stroke();
  ctx.strokeStyle="rgba(127,190,255,.45)";ctx.lineWidth=1.5;ctx.beginPath();for(let i=0;i<=16;i++){const px=i/16*vw,py=sea+Math.sin(t*2.5+i*.7)*4;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}ctx.stroke();
  for(const p of P)drawP(p);for(const s0 of prj)drawS(s0)}
function drawP(p){const x=sx(p.x),y=sy(p.y),r=p.r*cam.z;if(!p.alive){ctx.fillStyle="rgba(85,85,85,.65)";ctx.beginPath();ctx.arc(x,y+2,r,0,Math.PI*2);ctx.fill();return}
  if(G.phase==="aim"&&ap()===p){ctx.strokeStyle="rgba(255,224,143,.85)";ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r+5,0,Math.PI*2);ctx.stroke()}
  const body=ctx.createRadialGradient(x-r*.35,y-r*.4,3,x,y,r*1.05);body.addColorStop(0,lighten(p.c,.35));body.addColorStop(1,p.c);ctx.fillStyle=body;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  if(p.sd>0){const a=.3+Math.sin(performance.now()*.014)*.15;ctx.strokeStyle=`rgba(140,246,255,${a.toFixed(3)})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,r+8,0,Math.PI*2);ctx.stroke()}
  const len=36,a=rad(p.a),tx=p.x+Math.cos(a)*len,ty=p.y-Math.sin(a)*len;ctx.strokeStyle="rgba(240,248,255,.95)";ctx.lineWidth=Math.max(3,4*cam.z);ctx.lineCap="round";ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(sx(tx),sy(ty));ctx.stroke()}
function drawS(s){const x=sx(s.x),y=sy(s.y),r=(s.k==="mini"?3:5)*cam.z;ctx.fillStyle=s.col;ctx.shadowColor=s.col;ctx.shadowBlur=15;ctx.beginPath();ctx.arc(x,y,Math.max(1.8,r),0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}
function drawFx(){for(const p of part){ctx.globalAlpha=1-p.a/p.l;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(sx(p.x),sy(p.y),Math.max(1,p.r*cam.z),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
  ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="bold 16px Segoe UI";for(const t of txt){ctx.globalAlpha=Math.max(0,t.l/.8);ctx.fillStyle=t.c;ctx.fillText(t.t,sx(t.x),sy(t.y))}ctx.globalAlpha=1}
function render(t){ctx.clearRect(0,0,vw,vh);drawSky(t);drawWorld(t);drawFx()}

function update(dt){const step=dt*60;if(G.phase==="aim"&&!G.winner){G.timer-=dt;if(G.timer<=0){G.timer=0;toast("超时，自动切换回合");endTurn()}}uPlayers(step);uPrj(step);uPart(dt);uTxt(dt);uCam(dt);winCheck();hud();refreshBtns()}
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);render(now*.001);requestAnimationFrame(loop)}

window.addEventListener("resize",resize);
ui.angle.addEventListener("input",()=>{if(!can())return;ap().a=Number(ui.angle.value);syncAim()});
ui.power.addEventListener("input",()=>{if(!can())return;ap().p=Number(ui.power.value);syncAim()});
for(const b of ui.ws)b.addEventListener("click",()=>{if(!can())return;ap().w=b.dataset.w;refreshBtns()});
for(const b of ui.ss)b.addEventListener("click",()=>use(b.dataset.s));
ui.fire.addEventListener("pointerdown",e=>{if(!can())return;e.preventDefault();charge=performance.now();ui.fire.classList.add("ch")});
window.addEventListener("pointerup",()=>{if(charge==null)return;if(!can()){charge=null;ui.fire.classList.remove("ch");return}const held=Math.min((performance.now()-charge)/1000,1.4);charge=null;ui.fire.classList.remove("ch");fire(held)});
ui.restart.addEventListener("click",reset);
window.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(k==="a"||e.key==="ArrowLeft")key.l=true;
  if(k==="d"||e.key==="ArrowRight")key.r=true;
  if(k==="r")reset();
  if(!can())return;
  const p=ap();
  if(k==="q"){p.a=clamp(p.a-1,10,170);syncAim();e.preventDefault()}
  else if(k==="e"){p.a=clamp(p.a+1,10,170);syncAim();e.preventDefault()}
  else if(k==="j"){p.p=clamp(p.p-1,35,100);syncAim();e.preventDefault()}
  else if(k==="l"){p.p=clamp(p.p+1,35,100);syncAim();e.preventDefault()}
  else if(e.code==="Space"){fire(0);e.preventDefault()}
  else if(k==="1"||k==="2"||k==="3"){p.w={"1":"pulse","2":"split","3":"quake"}[k];refreshBtns();e.preventDefault()}
  else if(k==="z"){use("shield");e.preventDefault()}
  else if(k==="x"){use("gust");e.preventDefault()}
  else if(k==="c"){use("warp");e.preventDefault()}
});
window.addEventListener("keyup",e=>{if(e.key.toLowerCase()==="a"||e.key==="ArrowLeft")key.l=false;if(e.key.toLowerCase()==="d"||e.key==="ArrowRight")key.r=false});

genTerrain();place();startTurn(0,false);resize();hud();refreshBtns();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
